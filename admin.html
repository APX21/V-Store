<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - إدارة المتجر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-3xl mx-auto space-y-6">
        <header class="flex justify-between items-center bg-slate-900 border border-slate-800 p-4 rounded-xl shadow-lg">
            <h1 class="text-xl font-bold text-amber-400">🛡️ لوحة تحكم الأدمن</h1>
            <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-slate-300 transition">عرض المتجر 🌐</a>
        </header>

        <!-- قسم إضافة فئة جديدة أو قسم جديد -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl space-y-4 shadow-lg">
            <h2 class="text-lg font-bold border-r-4 border-amber-400 pr-3">إضافة فئة جديدة أو قسم جديد</h2>
            
            <div>
                <label class="block text-xs text-slate-400 mb-1">القسم الرئيسي</label>
                <select id="adm-category-select" onchange="checkCategorySelect()" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-200 focus:outline-none focus:border-amber-400 mb-2">
                    <option value="">جاري تحميل الأقسام...</option>
                </select>
                <!-- حقل يظهر فقط إذا أراد إضافة قسم جديد -->
                <input type="text" id="adm-new-category" placeholder="اكتب اسم القسم الجديد هنا..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-200 focus:outline-none focus:border-amber-400 hidden">
            </div>

            <div>
                <label class="block text-xs text-slate-400 mb-1">اسم الفئة (مثال: بطاقة أيتونز 10$)</label>
                <input type="text" id="adm-title" placeholder="اسم الفئة..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-200">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">السعر ($)</label>
                <input type="number" id="adm-price" placeholder="10" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-200">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">الأكواد (كل كود في سطر)</label>
                <textarea id="adm-codes" rows="3" placeholder="XXXX-XXXX" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-200 font-mono"></textarea>
            </div>
            <button onclick="addNewProduct()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-lg text-sm transition">حفظ الفئة الجديدة</button>
        </div>

        <!-- قسم إدارة المخزون وإضافة أكواد للفئات الموجودة -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl space-y-4 shadow-lg">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold border-r-4 border-blue-400 pr-3">إدارة المخزون (إضافة أكواد سريعة للفئات)</h2>
                <button onclick="loadAdminProducts()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-blue-400">تحديث المخزون 🔄</button>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-right text-sm">
                    <thead class="bg-slate-800/60 text-slate-400">
                        <tr>
                            <th class="p-3">القسم / الفئة</th>
                            <th class="p-3">المتوفر</th>
                            <th class="p-3 text-center">إضافة أكواد جديدة</th>
                        </tr>
                    </thead>
                    <tbody id="admin-products-table" class="divide-y divide-slate-800">
                        <tr><td colspan="3" class="p-4 text-center text-slate-500">جاري تحميل الفئات...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- قسم قائمة الزبائن والشحن -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl space-y-4 shadow-lg">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold border-r-4 border-emerald-400 pr-3">قائمة الزبائن وأرصدتهم</h2>
                <button onclick="loadUsersList()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-emerald-400">تحديث 🔄</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-right text-sm">
                    <thead class="bg-slate-800/60 text-slate-400">
                        <tr>
                            <th class="p-3">البريد الإلكتروني</th>
                            <th class="p-3">الرصيد</th>
                            <th class="p-3 text-center">شحن رصيد</th>
                        </tr>
                    </thead>
                    <tbody id="users-table" class="divide-y divide-slate-800">
                        <tr><td colspan="3" class="p-4 text-center text-slate-500">جاري التحميل...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzcJ8k5UXtpYt9239K30WzRhiZTqtMi3m3Fi35iqRWQz6GtUBB4ZpyrIc_GuhYpK9Fm/exec";
        let availableCategories = [];

        window.onload = function() {
            loadUsersList();
            loadAdminProducts();
        };

        async function loadAdminProducts() {
            try {
                let res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'getStoreData' })
                });
                let data = await res.json();
                if(data.status === 'success') {
                    renderAdminProducts(data.products);
                    updateCategoriesDropdown(data.products);
                }
            } catch(e) {
                document.getElementById('admin-products-table').innerHTML = '<tr><td colspan="3" class="p-4 text-center text-red-400">فشل التحميل.</td></tr>';
            }
        }

        function updateCategoriesDropdown(products) {
            availableCategories = [...new Set(products.map(p => p.category))];
            const select = document.getElementById('adm-category-select');
            
            let html = '<option value="">-- اختر القسم الرئيسي --</option>';
            availableCategories.forEach(cat => {
                html += `<option value="${cat}">${cat}</option>`;
            });
            html += `<option value="NEW_CAT">➕ إضافة قسم جديد...</option>`;
            select.innerHTML = html;
        }

        function checkCategorySelect() {
            let select = document.getElementById('adm-category-select');
            let newCatInput = document.getElementById('adm-new-category');
            if (select.value === 'NEW_CAT') {
                newCatInput.classList.remove('hidden');
                newCatInput.value = '';
                newCatInput.focus();
            } else {
                newCatInput.classList.add('hidden');
            }
        }

        function renderAdminProducts(products) {
            const tbody = document.getElementById('admin-products-table');
            if(!products || products.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="p-4 text-center text-slate-500">لا توجد منتجات مضافة.</td></tr>';
                return;
            }
            tbody.innerHTML = '';
            products.forEach(p => {
                let row = document.createElement('tr');
                row.className = "hover:bg-slate-800/40 transition";
                row.innerHTML = `
                    <td class="p-3">
                        <span class="text-xs text-amber-400 block">${p.category}</span>
                        <strong class="text-slate-100">${p.title}</strong> (${p.price}$)
                    </td>
                    <td class="p-3 text-emerald-400 font-bold">${p.codesCount} كود</td>
                    <td class="p-3 text-center">
                        <div class="flex flex-col gap-2 items-center">
                            <textarea id="codes-${p.id}" placeholder="ضع الأكواد هنا (كل كود بسطر)" rows="2" class="w-full bg-slate-950 border border-slate-800 rounded p-1.5 text-xs text-slate-200 font-mono"></textarea>
                            <button onclick="addCodes('${p.id}')" class="bg-blue-500 hover:bg-blue-400 text-slate-950 font-bold px-3 py-1 rounded text-xs transition w-full">إضافة للمخزون ➕</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        async function addCodes(productId) {
            let textarea = document.getElementById('codes-' + productId);
            let newCodes = textarea.value.trim();

            if(!newCodes) {
                alert('الرجاء كتابة الأكواد الجديدة أولاً.');
                return;
            }

            try {
                let res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'addCodesToProduct', productId, newCodes })
                });
                let data = await res.json();
                if(data.status === 'success') {
                    alert('تم إضافة الأكواد بنجاح للمخزون!');
                    textarea.value = '';
                    loadAdminProducts();
                } else {
                    alert('خطأ: ' + data.message);
                }
            } catch(e) {
                alert('حدث خطأ في الاتصال.');
            }
        }

        async function loadUsersList() {
            try {
                let res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'getUsersList' })
                });
                let data = await res.json();
                if(data.status === 'success') { renderUsersTable(data.users); }
            } catch(e) {}
        }

        function renderUsersTable(users) {
            const tbody = document.getElementById('users-table');
            if(!users || users.length === 0) { tbody.innerHTML = '<tr><td colspan="3" class="p-4 text-center text-slate-500">لا يوجد زبائن.</td></tr>'; return; }
            tbody.innerHTML = '';
            users.forEach(u => {
                let row = document.createElement('tr');
                row.className = "hover:bg-slate-800/40 transition";
                row.innerHTML = `
                    <td class="p-3 font-mono text-slate-300 text-xs">${u.email}</td>
                    <td class="p-3 text-emerald-400 font-bold">${u.balance.digest ? '' : u.balance.toFixed(2)} $</td>
                    <td class="p-3 text-center">
                        <div class="flex items-center justify-center gap-2">
                            <input type="number" id="amt-${CSS.escape(u.email)}" placeholder="المبلغ" class="w-20 bg-slate-950 border border-slate-800 rounded px-2 py-1 text-xs text-center text-slate-200">
                            <button onclick="addBalanceDirect('${u.email}')" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-3 py-1 rounded text-xs transition">شحن</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        async function addBalanceDirect(email) {
            let amountInput = document.getElementById('amt-' + CSS.escape(email));
            let amount = parseFloat(amountInput.value);
            if(isNaN(amount) || amount <= 0) { alert('مبلغ غير صحيح'); return; }
            let res = await fetch(`${SCRIPT_URL}?action=addBalance&email=${encodeURIComponent(email)}&amount=${amount}`);
            let data = await res.json();
            if(data.status === 'success') { alert('تم الشحن بنجاح!'); amountInput.value = ''; loadUsersList(); }
        }

        async function addNewProduct() {
            let selectVal = document.getElementById('adm-category-select').value;
            let category = '';

            if (selectVal === 'NEW_CAT') {
                category = document.getElementById('adm-new-category').value.trim();
            } else {
                category = selectVal;
            }

            let title = document.getElementById('adm-title').value.trim();
            let price = parseFloat(document.getElementById('adm-price').value);
            let codes = document.getElementById('adm-codes').value.trim();

            if(!category || !title || isNaN(price) || !codes) {
                alert('الرجاء اختيار القسم أو كتابته، وتعبئة كافة الحقول.');
                return;
            }

            let res = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'addProduct', title, price, category, codes })
            });
            let data = await res.json();
            if(data.status === 'success') {
                alert('تم إضافة الفئة بنجاح!');
                document.getElementById('adm-category-select').value = '';
                document.getElementById('adm-new-category').value = '';
                document.getElementById('adm-new-category').classList.add('hidden');
                document.getElementById('adm-title').value = '';
                document.getElementById('adm-price').value = '';
                document.getElementById('adm-codes').value = '';
                loadAdminProducts();
            }
        }
    </script>
</body>
</html>
