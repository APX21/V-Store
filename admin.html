<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - إدارة المتجر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-3xl mx-auto space-y-6">
        <!-- رأس الصفحة -->
        <header class="flex justify-between items-center bg-slate-900 border border-slate-800 p-4 rounded-xl shadow-lg">
            <h1 class="text-xl font-bold text-amber-400">🛡️ لوحة تحكم الأدمن</h1>
            <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-slate-300 transition">عرض المتجر 🌐</a>
        </header>

        <!-- أزرار التنقل الرئيسية (التبويبات) -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 bg-slate-900 p-2 rounded-xl border border-slate-800">
            <button onclick="switchAdminTab('add-product')" id="btn-add-product" class="py-2.5 px-3 rounded-lg text-xs font-bold transition bg-amber-500 text-slate-950">➕ إضافة فئة/قسم</button>
            <button onclick="switchAdminTab('manage-stock')" id="btn-manage-stock" class="py-2.5 px-3 rounded-lg text-xs font-bold transition text-slate-400 hover:text-slate-200">📦 إدارة المخزون</button>
            <button onclick="switchAdminTab('add-balance')" id="btn-add-balance" class="py-2.5 px-3 rounded-lg text-xs font-bold transition text-slate-400 hover:text-slate-200">💵 شحن رصيد</button>
            <button onclick="switchAdminTab('users-list')" id="btn-users-list" class="py-2.5 px-3 rounded-lg text-xs font-bold transition text-slate-400 hover:text-slate-200">👥 قائمة الزبائن</button>
        </div>

        <!-- 1. تبويب: إضافة فئة أو قسم جديد (بالقوائم المترابطة الذكية) -->
        <div id="tab-add-product" class="admin-tab bg-slate-900 border border-slate-800 p-6 rounded-xl space-y-4 shadow-lg">
            <h2 class="text-lg font-bold border-r-4 border-amber-400 pr-3">إضافة قسم أو فئة جديدة والأكواد</h2>
            
            <!-- اختيار القسم الرئيسي -->
            <div>
                <label class="block text-xs text-slate-400 mb-1">القسم الرئيسي</label>
                <select id="adm-category-select" onchange="onCategoryChange()" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-200 mb-2">
                    <option value="">جاري تحميل الأقسام...</option>
                </select>
                <input type="text" id="adm-new-category" placeholder="اكتب اسم القسم الجديد هنا..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-200 hidden">
            </div>

            <!-- اختيار الفئة (قائمة منسدلة تتحدث حسب القسم + خيار إضافة فئة جديدة) -->
            <div>
                <label class="block text-xs text-slate-400 mb-1">فئة المنتج</label>
                <select id="adm-title-select" onchange="onTitleChange()" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-200 mb-2">
                    <option value="">-- اختر القسم أولاً --</option>
                </select>
                <input type="text" id="adm-new-title" placeholder="اكتب اسم الفئة الجديدة هنا (مثال: بطاقة 15$)..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-200 hidden">
            </div>

            <div>
                <label class="block text-xs text-slate-400 mb-1">السعر ($)</label>
                <input type="number" id="adm-price" placeholder="10" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-200">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">الأكواد (كل كود في سطر)</label>
                <textarea id="adm-codes" rows="3" placeholder="XXXX-XXXX" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-200 font-mono"></textarea>
            </div>
            <button onclick="addNewProduct()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-lg text-sm transition">حفظ الأكواد / الفئة الجديدة</button>
        </div>

        <!-- 2. تبويب: إدارة المخزون -->
        <div id="tab-manage-stock" class="admin-tab hidden bg-slate-900 border border-slate-800 p-6 rounded-xl space-y-4 shadow-lg">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold border-r-4 border-blue-400 pr-3">إدارة المخزون (إضافة أكواد سريعة للفئات)</h2>
                <button onclick="loadAdminProducts()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-blue-400">تحديث المخزون 🔄</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-right text-sm">
                    <thead class="bg-slate-800/60 text-slate-400">
                        <tr>
                            <th class="p-3">القسم / الفئة</th>
                            <th class="p-3">المتوفر</th>
                            <th class="p-3 text-center">إضافة أكواد جديدة</th>
                        </tr>
                    </thead>
                    <tbody id="admin-products-table" class="divide-y divide-slate-800">
                        <tr><td colspan="3" class="p-4 text-center text-slate-500">جاري التحميل...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 3. تبويب: شحن رصيد -->
        <div id="tab-add-balance" class="admin-tab hidden bg-slate-900 border border-slate-800 p-6 rounded-xl space-y-4 shadow-lg">
            <h2 class="text-lg font-bold border-r-4 border-emerald-400 pr-3">شحن رصيد لزبون مباشرة</h2>
            <div>
                <label class="block text-xs text-slate-400 mb-1">البريد الإلكتروني للزبون</label>
                <input type="email" id="quick-user-email" placeholder="client@gmail.com" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-200">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">المبلغ المراد إضافته ($)</label>
                <input type="number" id="quick-user-amount" placeholder="25" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-200">
            </div>
            <button onclick="quickAddBalance()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-2.5 rounded-lg text-sm transition">إضافة الرصيد للحساب 💵</button>
        </div>

        <!-- 4. تبويب: قائمة الزبائن وأرصدتهم -->
        <div id="tab-users-list" class="admin-tab hidden bg-slate-900 border border-slate-800 p-6 rounded-xl space-y-4 shadow-lg">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold border-r-4 border-purple-400 pr-3">قائمة الزبائن المسجلين</h2>
                <button onclick="loadUsersList()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-purple-400">تحديث القائمة 🔄</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-right text-sm">
                    <thead class="bg-slate-800/60 text-slate-400">
                        <tr>
                            <th class="p-3">البريد الإلكتروني</th>
                            <th class="p-3">الرصيد الحالي</th>
                        </tr>
                    </thead>
                    <tbody id="users-table" class="divide-y divide-slate-800">
                        <tr><td colspan="2" class="p-4 text-center text-slate-500">جاري التحميل...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzcJ8k5UXtpYt9239K30WzRhiZTqtMi3m3Fi35iqRWQz6GtUBB4ZpyrIc_GuhYpK9Fm/exec";
        let globalProducts = [];

        window.onload = function() {
            loadAdminProducts();
            loadUsersList();
        };

        function switchAdminTab(tabId) {
            document.querySelectorAll('.admin-tab').forEach(t => t.classList.add('hidden'));
            document.getElementById('tab-' + tabId).classList.remove('hidden');

            ['add-product', 'manage-stock', 'add-balance', 'users-list'].forEach(id => {
                let btn = document.getElementById('btn-' + id);
                if(id === tabId) {
                    btn.className = "py-2.5 px-3 rounded-lg text-xs font-bold transition bg-amber-500 text-slate-950 shadow";
                } else {
                    btn.className = "py-2.5 px-3 rounded-lg text-xs font-bold transition text-slate-400 hover:text-slate-200";
                }
            });
        }

        async function loadAdminProducts() {
            try {
                let res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'getStoreData' })
                });
                let data = await res.json();
                if(data.status === 'success') {
                    globalProducts = data.products;
                    renderAdminProducts(globalProducts);
                    updateCategoriesDropdown(globalProducts);
                }
            } catch(e) {
                document.getElementById('admin-products-table').innerHTML = '<tr><td colspan="3" class="p-4 text-center text-red-400">فشل التحميل.</td></tr>';
            }
        }

        function updateCategoriesDropdown(products) {
            let categories = [...new Set(products.map(p => p.category))];
            const select = document.getElementById('adm-category-select');
            
            let html = '<option value="">-- اختر القسم الرئيسي --</option>';
            categories.forEach(cat => {
                html += `<option value="${cat}">${cat}</option>`;
            });
            html += `<option value="NEW_CAT">➕ إضافة قسم جديد...</option>`;
            select.innerHTML = html;
            
            // إعادة ضبط قائمة الفئات
            document.getElementById('adm-title-select').innerHTML = '<option value="">-- اختر القسم أولاً --</option>';
        }

        // عند تغيير القسم الرئيسي، يتم تحديث قائمة الفئات التابعة له تلقائياً
        function onCategoryChange() {
            let selectVal = document.getElementById('adm-category-select').value;
            let newCatInput = document.getElementById('adm-new-category');
            let titleSelect = document.getElementById('adm-title-select');
            let newTitleInput = document.getElementById('adm-new-title');

            if (selectVal === 'NEW_CAT') {
                newCatInput.classList.remove('hidden');
                newCatInput.value = '';
                newCatInput.focus();
                // إذا كان قسم جديد، فهذا يعني حتماً فئة جديدة
                titleSelect.innerHTML = '<option value="NEW_TITLE">➕ إضافة فئة جديدة...</option>';
                titleSelect.value = 'NEW_TITLE';
                newTitleInput.classList.remove('hidden');
                newTitleInput.value = '';
            } else {
                newCatInput.classList.add('hidden');
                newTitleInput.classList.add('hidden');

                // تصفية الفئات التابعة لهذا القسم فقط
                let filtered = globalProducts.filter(p => p.category === selectVal);
                let html = '<option value="">-- اختر الفئة --</option>';
                filtered.forEach(p => {
                    html += `<option value="${p.title}" data-price="${p.price}" data-id="${p.id}">${p.title} (${p.price}$)</option>`;
                });
                html += `<option value="NEW_TITLE">➕ إضافة فئة جديدة...</option>`;
                titleSelect.innerHTML = html;
            }
        }

        // عند اختيار الفئة (سواء قديمة أو جديدة)
        function onTitleChange() {
            let titleSelectVal = document.getElementById('adm-title-select').value;
            let newTitleInput = document.getElementById('adm-new-title');
            let priceInput = document.getElementById('adm-price');

            if (titleSelectVal === 'NEW_TITLE') {
                newTitleInput.classList.remove('hidden');
                newTitleInput.value = '';
                newTitleInput.focus();
                priceInput.value = '';
            } else {
                newTitleInput.classList.add('hidden');
                // جلب السعر التلقائي للفئة المختارة لتسهيل العمل
                let selectedOption = document.getElementById('adm-title-select').selectedOptions[0];
                if (selectedOption && selectedOption.dataset.price) {
                    priceInput.value = selectedOption.dataset.price;
                }
            }
        }

        function renderAdminProducts(products) {
            const tbody = document.getElementById('admin-products-table');
            if(!products || products.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="p-4 text-center text-slate-500">لا توجد منتجات مضافة.</td></tr>';
                return;
            }
            tbody.innerHTML = '';
            products.forEach(p => {
                let row = document.createElement('tr');
                row.className = "hover:bg-slate-800/40 transition";
                row.innerHTML = `
                    <td class="p-3">
                        <span class="text-xs text-amber-400 block">${p.category}</span>
                        <strong class="text-slate-100">${p.title}</strong> (${p.price}$)
                    </td>
                    <td class="p-3 text-emerald-400 font-bold">${p.codesCount} كود</td>
                    <td class="p-3 text-center">
                        <div class="flex flex-col gap-2 items-center">
                            <textarea id="codes-${p.id}" placeholder="ضع الأكواد هنا (كل كود بسطر)" rows="2" class="w-full bg-slate-950 border border-slate-800 rounded p-1.5 text-xs text-slate-200 font-mono"></textarea>
                            <button onclick="addCodes('${p.id}')" class="bg-blue-500 hover:bg-blue-400 text-slate-950 font-bold px-3 py-1 rounded text-xs transition w-full">إضافة للمخزون ➕</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        async function addCodes(productId) {
            let textarea = document.getElementById('codes-' + productId);
            let newCodes = textarea.value.trim();

            if(!newCodes) {
                alert('الرجاء كتابة الأكواد الجديدة أولاً.');
                return;
            }

            try {
                let res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'addCodesToProduct', productId, newCodes })
                });
                let data = await res.json();
                if(data.status === 'success') {
                    alert('تم إضافة الأكواد بنجاح للمخزون!');
                    textarea.value = '';
                    loadAdminProducts();
                } else {
                    alert('خطأ: ' + data.message);
                }
            } catch(e) {
                alert('حدث خطأ في الاتصال.');
            }
        }

        async function quickAddBalance() {
            let email = document.getElementById('quick-user-email').value.trim();
            let amount = parseFloat(document.getElementById('quick-user-amount').value);

            if(!email || isNaN(amount) || amount <= 0) {
                alert('الرجاء إدخال البريد الإلكتروني والمبلغ بشكل صحيح.');
                return;
            }

            try {
                let res = await fetch(`${SCRIPT_URL}?action=addBalance&email=${encodeURIComponent(email)}&amount=${amount}`);
                let data = await res.json();
                if(data.status === 'success') {
                    alert('تم شحن الرصيد بنجاح! الرصيد الحالي للزبون: ' + data.newBalance + ' $');
                    document.getElementById('quick-user-email').value = '';
                    document.getElementById('quick-user-amount').value = '';
                    loadUsersList();
                }
            } catch(e) {
                alert('تم إرسال الطلب بنجاح.');
            }
        }

        async function loadUsersList() {
            try {
                let res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'getUsersList' })
                });
                let data = await res.json();
                if(data.status === 'success') { renderUsersTable(data.users); }
            } catch(e) {}
        }

        function renderUsersTable(users) {
            const tbody = document.getElementById('users-table');
            if(!users || users.length === 0) { tbody.innerHTML = '<tr><td colspan="2" class="p-4 text-center text-slate-500">لا يوجد زبائن.</td></tr>'; return; }
            tbody.innerHTML = '';
            users.forEach(u => {
                let row = document.createElement('tr');
                row.className = "hover:bg-slate-800/40 transition";
                row.innerHTML = `
                    <td class="p-3 font-mono text-slate-300 text-xs">${u.email}</td>
                    <td class="p-3 text-emerald-400 font-bold">${u.balance.toFixed(2)} $</td>
                `;
                tbody.appendChild(row);
            });
        }

        async function addNewProduct() {
            let catSelect = document.getElementById('adm-category-select').value;
            let category = (catSelect === 'NEW_CAT') ? document.getElementById('adm-new-category').value.trim() : catSelect;

            let titleSelect = document.getElementById('adm-title-select').value;
            let title = '';
            let productIdToUpdate = '';

            if (titleSelect === 'NEW_TITLE') {
                title = document.getElementById('adm-new-title').value.trim();
            } else {
                let selectedOption = document.getElementById('adm-title-select').selectedOptions[0];
                title = titleSelect;
                if (selectedOption) {
                    productIdToUpdate = selectedOption.dataset.id;
                }
            }

            let price = parseFloat(document.getElementById('adm-price').value);
            let codes = document.getElementById('adm-codes').value.trim();

            if(!category || !title || isNaN(price) || !codes) {
                alert('الرجاء اختيار/كتابة القسم والفئة، وتعبئة السعر والأكواد.');
                return;
            }

            // إذا كانت الفئة موجودة مسبقاً وتختار إضافات أكواد لها
            if (productIdToUpdate) {
                let res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'addCodesToProduct', productId: productIdToUpdate, newCodes: codes })
                });
                let data = await res.json();
                if(data.status === 'success') {
                    alert('الفئة موجودة مسبقاً، وتم إضافة الأكواد الجديدة إلى مخزونها بنجاح!');
                    clearForm();
                    loadAdminProducts();
                }
            } else {
                // إذا كانت فئة جديدة تماماً
                let res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'addProduct', title, price, category, codes })
                });
                let data = await res.json();
                if(data.status === 'success') {
                    alert('تم إضافة الفئة الجديدة بنجاح!');
                    clearForm();
                    loadAdminProducts();
                }
            }
        }

        function clearForm() {
            document.getElementById('adm-category-select').value = '';
            document.getElementById('adm-new-category').value = '';
            document.getElementById('adm-new-category').classList.add('hidden');
            document.getElementById('adm-title-select').innerHTML = '<option value="">-- اختر القسم أولاً --</option>';
            document.getElementById('adm-new-title').value = '';
            document.getElementById('adm-new-title').classList.add('hidden');
            document.getElementById('adm-price').value = '';
            document.getElementById('adm-codes').value = '';
        }
    </script>
</body>
</html>
