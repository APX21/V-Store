<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المتجر - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen p-4 sm:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- هيدر اللوحة -->
        <header class="bg-slate-800 border border-slate-700 rounded-2xl p-6 mb-8 shadow-xl flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-emerald-400">🛠️ لوحة تحكم المتجر</h1>
                <p class="text-slate-400 text-sm mt-1">إضافة المنتجات وإدارة الأكواد بكل سهولة</p>
            </div>
            <a href="index.html" target="_blank" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm transition">عرض المتجر ↗</a>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- نموذج إضافة منتج جديد -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
                <h2 class="text-xl font-bold mb-4 text-emerald-400">➕ إضافة منتج جديد</h2>
                <form id="product-form" onsubmit="addProduct(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">معرف المنتج (Product ID - رقم فريد):</label>
                        <input type="number" id="p-id" required placeholder="مثال: 6" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">اسم المنتج:</label>
                        <input type="text" id="p-name" required placeholder="مثال: iTunes $20" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">السعر ($):</label>
                        <input type="number" step="0.01" id="p-price" required placeholder="20.00" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">الفئة (Category):</label>
                        <input type="text" id="p-category" required placeholder="iTunes / Pubg / Steam..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <button type="submit" id="p-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 font-medium py-2.5 rounded-lg transition">حفظ وإضافة المنتج</button>
                    <div id="p-result" class="text-sm text-center"></div>
                </form>
            </div>

            <!-- نموذج إضافة كود جديد للبطاقات -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
                <h2 class="text-xl font-bold mb-4 text-emerald-400">🔑 إضافة كود بطاقة جديد</h2>
                <form id="code-form" onsubmit="addCode(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">معرف الكود (Code ID - رقم فريد):</label>
                        <input type="number" id="c-id" required placeholder="مثال: 101" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">معرف المنتج المرتبط (Product ID):</label>
                        <input type="number" id="c-product-id" required placeholder="مثال: 1" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">الكود الفعلي أو رقم البطاقة:</label>
                        <input type="text" id="c-actual" required placeholder="XXXX-XXXX-XXXX" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <button type="submit" id="c-btn" class="w-full bg-blue-600 hover:bg-blue-500 font-medium py-2.5 rounded-lg transition">إضافة الكود للمخزون</button>
                    <div id="c-result" class="text-sm text-center"></div>
                </form>
            </div>

        </div>
    </div>

    <!-- كود الاتصال بالـ API -->
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwmREd92nl6kqYhGdaR95zXhLEswOUkoDQBAYPZkBxT9altEUZcCHNDDvJvlaQ_6pLcSg/exec";

        async function addProduct(event) {
            event.preventDefault();
            const btn = document.getElementById('p-btn');
            const result = document.getElementById('p-result');
            
            btn.disabled = true;
            btn.innerText = "جاري الإضافة...";
            result.innerHTML = '<span class="text-yellow-400">جاري إرسال البيانات...</span>';

            const data = {
                action: "addProduct",
                productId: document.getElementById('p-id').value,
                productName: document.getElementById('p-name').value,
                price: document.getElementById('p-price').value,
                category: document.getElementById('p-category').value
            };

            try {
                // إرسال طلب POST للـ Apps Script
                await fetch(API_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });

                result.innerHTML = '<span class="text-emerald-400">تمت إضافة المنتج بنجاح!</span>';
                document.getElementById('product-form').reset();
            } catch (err) {
                result.innerHTML = '<span class="text-red-400">حدث خطأ أثناء الإضافة.</span>';
            }
            btn.disabled = false;
            btn.innerText = "حفظ وإضافة المنتج";
        }

        async function addCode(event) {
            event.preventDefault();
            const btn = document.getElementById('c-btn');
            const result = document.getElementById('c-result');
            
            btn.disabled = true;
            btn.innerText = "جاري الإضافة...";
            result.innerHTML = '<span class="text-yellow-400">جاري إرسال الكود...</span>';

            const data = {
                action: "addCode",
                codeId: document.getElementById('c-id').value,
                productId: document.getElementById('c-product-id').value,
                actualCode: document.getElementById('c-actual').value
            };

            try {
                await fetch(API_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });

                result.innerHTML = '<span class="text-emerald-400">تمت إضافة الكود بنجاح للمخزون!</span>';
                document.getElementById('code-form').reset();
            } catch (err) {
                result.innerHTML = '<span class="text-red-400">حدث خطأ أثناء إضافة الكود.</span>';
            }
            btn.disabled = false;
            btn.innerText = "إضافة الكود للمخزون";
        }
    </script>
</body>
</html>
