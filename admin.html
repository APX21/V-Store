<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - إدارة المتجر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-3xl mx-auto space-y-6">
        <header class="flex justify-between items-center bg-slate-900 border border-slate-800 p-4 rounded-xl">
            <h1 class="text-xl font-bold text-amber-400">🛡️ لوحة تحكم الأدمن</h1>
            <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-slate-300">عرض المتجر 🌐</a>
        </header>

        <!-- نموذج إضافة منتج جديد -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl space-y-4 shadow-lg">
            <h2 class="text-lg font-bold border-r-4 border-amber-400 pr-3">إضافة بطاقة جديدة والمخزون</h2>
            <div>
                <label class="block text-xs text-slate-400 mb-1">اسم المنتج</label>
                <input type="text" id="adm-title" placeholder="مثال: بطاقة أيتونز 10$" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-200">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">السعر ($)</label>
                    <input type="number" id="adm-price" placeholder="10" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-200">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">القسم</label>
                    <select id="adm-cat" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-200">
                        <option value="itunes">آيتونز</option>
                        <option value="playstation">بلايستيشن</option>
                        <option value="steam">ستيم</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">الأكواد (ضع كل كود في سطر منفصل)</label>
                <textarea id="adm-codes" rows="4" placeholder="XXXX-XXXX-XXXX&#10;YYYY-YYYY-YYYY" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-200 font-mono"></textarea>
            </div>
            <button onclick="addNewProduct()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-6 py-2.5 rounded-lg text-sm transition">حفظ وإضافة المنتج للشيت</button>
        </div>

        <!-- نموذج شحن رصيد لزبون -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl space-y-4 shadow-lg">
            <h2 class="text-lg font-bold border-r-4 border-emerald-400 pr-3">شحن أو تعديل رصيد زبون</h2>
            <div>
                <label class="block text-xs text-slate-400 mb-1">البريد الإلكتروني للزبون</label>
                <input type="email" id="adm-user-email" placeholder="client@gmail.com" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-200">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">المبلغ المراد إضافته ($)</label>
                <input type="number" id="adm-user-amount" placeholder="25" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-200">
            </div>
            <button onclick="addBalanceToUser()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-6 py-2.5 rounded-lg text-sm transition">إضافة الرصيد لحساب الزبون</button>
        </div>
    </div>

    <!-- السكريبت الخاص بالأدمن -->
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyBfY413FMWlq5x0WfoxKZ3OOeBmqTiQbtceUbHMZT_BmF2WIbDu35S0QXEEKjPij_p/exec";

        async function addNewProduct() {
            let title = document.getElementById('adm-title').value;
            let price = parseFloat(document.getElementById('adm-price').value);
            let category = document.getElementById('adm-cat').value;
            let codes = document.getElementById('adm-codes').value;

            if(!title || isNaN(price) || !codes) {
                alert('الرجاء تعبئة كافة الحقول بشكل صحيح.');
                return;
            }

            try {
                let res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'addProduct', title, price, category, codes })
                });
                let data = await res.json();
                if(data.status === 'success') {
                    alert('تم إضافة المنتج والأكواد بنجاح!');
                    document.getElementById('adm-title').value = '';
                    document.getElementById('adm-price').value = '';
                    document.getElementById('adm-codes').value = '';
                } else {
                    alert('خطأ: ' + data.message);
                }
            } catch(e) { alert('حدث خطأ في الاتصال.'); }
        }

        async function addBalanceToUser() {
            let email = document.getElementById('adm-user-email').value.trim();
            let amount = parseFloat(document.getElementById('adm-user-amount').value);

            if(!email || isNaN(amount)) {
                alert('الرجاء إدخال البريد والمبلغ بشكل صحيح.');
                return;
            }

            try {
                let res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'addBalance', email, amount })
                });
                let data = await res.json();
                if(data.status === 'success') {
                    alert('تم شحن رصيد الزبون بنجاح وأصبح رصيده الجديد: ' + data.newBalance + ' $');
                    document.getElementById('adm-user-email').value = '';
                    document.getElementById('adm-user-amount').value = '';
                } else {
                    alert('خطأ: ' + data.message);
                }
            } catch(e) { alert('حدث خطأ في الاتصال.'); }
        }
    </script>
</body>
</html>
