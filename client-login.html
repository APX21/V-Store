<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل دخول الزبون - متجر البطاقات</title>
  <style>
    :root { --primary: #2563eb; --bg: #f8fafc; --border: #e2e8f0; --text: #1e293b; }
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .login-card { background: white; padding: 30px; border-radius: 12px; border: 1px solid var(--border); width: 100%; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); text-align: center; }
    h2 { margin-top: 0; color: var(--primary); }
    input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; }
    button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; }
    button:hover { opacity: 0.9; }
    .error { color: #dc2626; font-size: 0.85rem; margin-top: 10px; }
  </style>
</head>
<body>

<div class="login-card">
  <h2>🔐 دخول الزبون</h2>
  <p style="color: #64748b; font-size: 0.9rem;">أدخل بريدك الإلكتروني المسجل لدى الإدارة</p>
  
  <form onsubmit="clientLogin(event)">
    <input type="email" id="clientEmailInput" placeholder="example@domain.com" required>
    <button type="submit">دخول إلى حسابي</button>
  </form>
  <div id="errorMsg" class="error"></div>
</div>

<script>
  function clientLogin(e) {
    e.preventDefault();
    const email = document.getElementById('clientEmailInput').value.trim().toLowerCase();
    const customers = JSON.parse(localStorage.getItem('admin_customers')) || [];

    const customer = customers.find(c => c.email && c.email.toLowerCase() === email);

    if (customer) {
      sessionStorage.setItem('logged_client_id', customer.id);
      window.location.href = 'client.html';
    } else {
      document.getElementById('errorMsg').textContent = '⚠️ البريد الإلكتروني غير مسجل! تواصل مع الإدارة لإضافة إيميلك.';
    }
  }
</script>
</body>
</html>
